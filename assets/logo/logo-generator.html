<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BennieTech logo generator</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #ececea; color: #111; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; padding: 16px; }
  .card { background: #fafaf8; border-radius: 18px; padding: 48px 32px; display: grid; place-items: center; min-height: 220px; }
  .card--ink { background: #0d0d0d; }
  .card--volt { background: #c6f432; }
  .big svg { width: min(92vw, 1100px); height: auto; }
  .card svg { width: 100%; height: auto; max-height: 140px; }
  .mark svg { height: 260px; width: auto; }
  .tiny svg { height: 22px; width: auto; }
  p { margin: 8px 16px; color: #666; }
  button { margin: 0 16px 16px; }
</style>
</head>
<body>
  <!-- Open through the local server (node server.js) -> http://localhost:8080/assets/logo/logo-generator.html
       "Download" saves the SVG files (lockup light/dark, mark light/dark, wordmark) built from js/brand/logotype.js. -->
  <div class="row"><div class="card big" id="big"></div></div>
  <div class="row">
    <div class="card" id="light"></div>
    <div class="card card--ink" id="dark"></div>
    <div class="card card--volt" id="volt"></div>
  </div>
  <div class="row">
    <div class="card mark" id="mark"></div>
    <div class="card card--ink mark" id="markDark"></div>
    <div class="card tiny" id="tiny"></div>

  </div>
  <button id="dl">Download SVGs</button>
<script type="module">
  import { logoSVG } from '../../js/brand/logotype.js';
  const $ = id => document.getElementById(id);
  $('big').innerHTML = logoSVG();
  $('light').innerHTML = logoSVG();
  $('dark').innerHTML = logoSVG({ ink: '#f4f4f2' });
  $('volt').innerHTML = logoSVG({ accent: '#0d0d0d' });
  $('mark').innerHTML = logoSVG({ layout: 'mark' });
  $('markDark').innerHTML = logoSVG({ layout: 'mark', ink: '#f4f4f2' });
  $('tiny').innerHTML = logoSVG();

  const files = {
    'bennietech-logo.svg': logoSVG(),
    'bennietech-logo-dark.svg': logoSVG({ ink: '#f4f4f2' }),
    'bennietech-mark.svg': logoSVG({ layout: 'mark' }),
    'bennietech-mark-dark.svg': logoSVG({ layout: 'mark', ink: '#f4f4f2' }),
    'bennietech-wordmark.svg': logoSVG({ layout: 'word' }),
  };
  window.svgs = files;
  $('dl').onclick = () => Object.entries(files).forEach(([name, svg]) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' })); a.download = name; a.click();
  });
</script>
</body>
</html>
